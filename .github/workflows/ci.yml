name: CI
on:
  pull_request:
  workflow_dispatch:
    inputs:
      gpui_ref:
        description: Full Chord-Ink/gpui commit SHA
        required: true
        type: string
        default: 4570b414a6a02d614de3e525203874313c4876ec
  push:
    branches:
      - main
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'main' && github.sha || 'anysha' }}
  cancel-in-progress: true

jobs:
  closeout:
    name: Native closeout (${{ matrix.run_on }})
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'codex/inkui-closeout-20260922') ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/inkui-closeout-20260922')
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        run_on: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.run_on }}
    env:
      GPUI_REF: ${{ inputs.gpui_ref || '4570b414a6a02d614de3e525203874313c4876ec' }}
      RUSTC_WRAPPER: ""
    defaults:
      run:
        shell: pwsh
        working-directory: gpui-kit
    steps:
      - uses: actions/checkout@v4
        with:
          path: gpui-kit
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate GPUI SHA
        run: |
          if ($env:GPUI_REF -cnotmatch '^[0-9a-f]{40}$') {
            throw 'gpui_ref must be a full lowercase commit SHA'
          }
      - uses: actions/checkout@v4
        with:
          repository: Chord-Ink/gpui
          ref: ${{ env.GPUI_REF }}
          path: gpui
          persist-credentials: false
      - name: Pin local GPUI dependencies
        run: |
          $actual = git -C ../gpui rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:GPUI_REF) {
            throw 'GPUI checkout does not match gpui_ref'
          }
          Write-Output "GPUI commit: $actual"
          git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify Base checkout' }
          $gpuiRoot = (Resolve-Path ../gpui).Path.Replace('\', '/')
          $config = @('[patch."https://github.com/Chord-Ink/gpui"]')
          foreach ($name in @('gpui', 'gpui_platform', 'gpui_web', 'gpui_macros', 'reqwest_client', 'sum_tree')) {
            $config += "$name = { path = '$gpuiRoot/crates/$name' }"
          }
          $manifest = Get-Content ../gpui/Cargo.toml -Raw
          $patches = [regex]::Match($manifest, '(?ms)^\[patch\.crates-io\]\r?\n.*?(?=^\[|\z)').Value
          $config += $patches
          Set-Content .cargo/closeout.toml -Value $config -Encoding utf8
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          rust-src-dir: gpui-kit
          rustflags: ""
          cache-key: ${{ env.GPUI_REF }}
      - name: Install system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: script/bootstrap
      - name: Check native consumers
        run: cargo --config .cargo/closeout.toml check -p gpui-base -p gpui-component --lib --bins --tests --examples
      - name: Test Base and components
        run: cargo --config .cargo/closeout.toml test -p gpui-base -p gpui-component --lib --tests
      - name: Lint native consumers
        run: cargo --config .cargo/closeout.toml clippy -p gpui-base -p gpui-component --lib --bins --tests --examples -- -D warnings

  test:
    name: Test
    if: github.event_name != 'workflow_dispatch' && github.head_ref != 'codex/inkui-closeout-20260922'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            run_on: macos-latest
          - target: x86_64-linux-gnu
            run_on: ubuntu-latest
          - target: x86_64-windows-msvc
            run_on: windows-latest
    runs-on: ${{ matrix.run_on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Install system dependencies
        if: ${{ matrix.run_on != 'windows-latest' }}
        run: script/bootstrap
      - name: Machete
        if: ${{ matrix.run_on == 'macos-latest' }}
        uses: bnjbvr/cargo-machete@v0.9.1
      - name: Setup | Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: test-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Typo check
        if: ${{ matrix.run_on == 'macos-latest' }}
        run: |
          command -v typos >/dev/null || cargo install typos-cli
          typos
      - name: Skill guides are in sync
        if: ${{ matrix.run_on == 'macos-latest' }}
        run: |
          for pair in "coding-guides skills/gpui-kit" "design-guides skills/gpui-kit-design-guides"; do
            set -- $pair
            if ! diff -u "website/docs/$1.md" "$2/references/$1.md"; then
              echo "::error::$2/references/$1.md is stale."
              echo "Run: cp website/docs/$1.md $2/references/$1.md"
              exit 1
            fi
          done
      - name: Lint
        if: ${{ matrix.run_on == 'macos-latest' }}
        run: |
          cargo clippy -p gpui-component -p gpui-component-story -p gpui-kit-assets -- --deny warnings
      - name: Check without default features (tree-sitter disabled)
        if: ${{ matrix.run_on == 'ubuntu-latest' }}
        run: |
          cargo check -p gpui-component --no-default-features
      - name: Test Linux
        if: ${{ matrix.run_on == 'ubuntu-latest' }}
        run: |
          cargo test --workspace --exclude gpui-shell --features gpui-component-story/test-support
      - name: Test Windows
        if: ${{ matrix.run_on == 'windows-latest' }}
        run: |
          cargo test --workspace --exclude gpui-shell --features gpui-component-story/test-support
      - name: Test MacOS
        if: ${{ matrix.run_on == 'macos-latest' }}
        run: |
          cargo test --workspace --exclude gpui-shell --features gpui-component-story/test-support
          cargo test -p gpui-component --doc

  gpui-shell-core:
    name: GPUI Shell Core
    if: github.event_name != 'workflow_dispatch' && github.head_ref != 'codex/inkui-closeout-20260922'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Install system dependencies
        run: script/bootstrap
      - name: Setup | Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: shell-core-cargo-x86_64-linux-gnu-${{ hashFiles('**/Cargo.lock') }}
      - name: Test runtime core without standard-library integration cases
        run: |
          cargo test -p gpui-shell --release --lib -- \
            --skip tests::standard_runtime \
            --skip tests::network \
            --skip tests::fs \
            --skip tests::process \
            --skip tests::benchmark
          cargo test -p gpui-shell --release tests::benchmark
          cargo test -p gpui-shell --doc
      - name: Lint GPUI Shell
        run: cargo clippy -p gpui-shell --all-targets -- -D warnings

  gpui-component-shell:
    name: GPUI Component Shell
    if: github.event_name != 'workflow_dispatch' && github.head_ref != 'codex/inkui-closeout-20260922'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install system dependencies
        run: script/bootstrap
      - name: Setup | Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: component-shell-cargo-x86_64-linux-gnu-${{ hashFiles('**/Cargo.lock') }}
      - name: Test component bindings
        run: cargo test -p gpui-component-shell --all-targets
      - name: Lint component bindings
        run: cargo clippy -p gpui-component-shell --all-targets -- -D warnings
      # The inventory test proves every public component is registered or
      # explicitly deferred; this proves the JavaScript gallery covers what the
      # inventory claims. Without it the two drift silently.
      - name: Verify story coverage against the component inventory
        run: node examples/js_story/fixtures/verify-coverage.mjs

  gpui-shell-standard-runtime:
    name: GPUI Shell Standard Runtime (${{ matrix.target }})
    if: github.event_name != 'workflow_dispatch' && github.head_ref != 'codex/inkui-closeout-20260922'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            run_on: macos-latest
          - target: x86_64-linux-gnu
            run_on: ubuntu-latest
          - target: x86_64-windows-msvc
            run_on: windows-latest
    runs-on: ${{ matrix.run_on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install system dependencies
        if: ${{ matrix.run_on != 'windows-latest' }}
        run: script/bootstrap
      - name: Setup | Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: shell-standard-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Test LLRT module integration
        run: |
          cargo test -p gpui-shell --release tests::standard_runtime
          cargo test -p gpui-shell --release tests::fs
          cargo test -p gpui-shell --release tests::process
          cargo test -p gpui-shell --release tests::network
          cargo test -p gpui-shell --release tests::render
          cargo test -p gpui-shell --release tests::snapshot
          cargo test -p gpui-shell --release tests::host_api
          cargo test -p gpui-shell --release tests::http_request
